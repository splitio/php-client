pipeline:
  name: php-client
  identifier: phpclient
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubharnessgitops
        repoName: php-client
        build:
          type: branch
          spec:
            branch: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Install PHP
                  identifier: Install_PHP
                  spec:
                    shell: Bash
                    command: |-
                      add-apt-repository -y ppa:ondrej/php
                      apt-get update -qq
                      apt-get install -y php<+matrix.phpVersion> php<+matrix.phpVersion>-cli php<+matrix.phpVersion>-xml php<+matrix.phpVersion>-mbstring php<+matrix.phpVersion>-redis php<+matrix.phpVersion>-curl php<+matrix.phpVersion>-zip php<+matrix.phpVersion>-pcov unzip -qq
                      update-alternatives --set php /usr/bin/php<+matrix.phpVersion>
                      php --version
              - step:
                  type: Run
                  name: Start Redis
                  identifier: Start_Redis
                  spec:
                    shell: Sh
                    command: |-
                      apt-get install -y redis-server -qq
                      redis-server --daemonize yes --port 6379
                      redis-cli ping
              - step:
                  type: Run
                  name: Wait for Redis
                  identifier: Wait_for_Redis
                  spec:
                    shell: Sh
                    command: |-
                      for i in $(seq 1 15); do
                        redis-cli ping && break
                        echo "Waiting for Redis... attempt $i"
                        sleep 1
                      done
              - step:
                  type: Run
                  name: Install Composer
                  identifier: Install_Composer
                  spec:
                    shell: Bash
                    command: |-
                      php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
                      php composer-setup.php --install-dir=/usr/local/bin --filename=composer
                      php -r "unlink('composer-setup.php');"
                      composer --version
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Bash
                    command: composer install --no-interaction --prefer-dist --optimize-autoloader
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    shell: Bash
                    command: |-
                      vendor/bin/phpcs --ignore=functions.php --standard=PSR2 src/ && XDEBUG_MODE=coverage vendor/bin/phpunit -c phpunit.xml.dist -v --testsuite integration --coverage-clover coverage.xml
                      python3 -c 'import textwrap; exec(textwrap.dedent("""
                      import xml.etree.ElementTree as ET
                      from pathlib import Path
                      root = ET.parse("coverage.xml").getroot()
                      cwd = Path(".").resolve()
                      out = []
                      for f in root.iter("file"):
                          name = f.get("name") or ""
                          try:
                              rel = Path(name).resolve().relative_to(cwd).as_posix()
                          except Exception:
                              rel = name
                          das = []
                          for line in f.findall("line"):
                              num, count = line.get("num"), line.get("count")
                              if num is None or count is None:
                                  continue
                              das.append("DA:%s,%s" % (num, count))
                          if not das:
                              continue
                          out.append("SF:" + rel)
                          out.extend(das)
                          out.append("end_of_record")
                      Path("coverage").mkdir(exist_ok=True)
                      Path("coverage/lcov.info").write_text(chr(10).join(out) + chr(10))
                      print("lcov records=%s lines=%s" % (out.count("end_of_record"), sum(1 for row in out if row.startswith("DA:"))))
                      """))'
                      test -s coverage/lcov.info
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  template:
                    templateRef: account.codeCoverage
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: coverage/lcov.info
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/vendor/**,**/tests/**,**/test/**"
        strategy:
          matrix:
            phpVersion:
              - "7.3"
              - "8.0"
              - "8.1"
              - "8.2"
              - "8.3"
              - "8.5"
