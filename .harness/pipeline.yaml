pipeline:
  name: php-client
  identifier: phpclient
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubharnessgitops
        repoName: php-client
        build:
          type: branch
          spec:
            branch: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Install PHP
                  identifier: Install_PHP
                  spec:
                    shell: Bash
                    command: |-
                      add-apt-repository -y ppa:ondrej/php
                      apt-get update -qq
                      apt-get install -y php<+matrix.phpVersion> php<+matrix.phpVersion>-cli php<+matrix.phpVersion>-xml php<+matrix.phpVersion>-mbstring php<+matrix.phpVersion>-redis php<+matrix.phpVersion>-curl php<+matrix.phpVersion>-zip unzip -qq
                      update-alternatives --set php /usr/bin/php<+matrix.phpVersion>
                      php --version
              - step:
                  type: Run
                  name: Start Redis
                  identifier: Start_Redis
                  spec:
                    shell: Sh
                    command: |-
                      apt-get install -y redis-server -qq
                      redis-server --daemonize yes --port 6379
                      redis-cli ping
              - step:
                  type: Run
                  name: Wait for Redis
                  identifier: Wait_for_Redis
                  spec:
                    shell: Sh
                    command: |-
                      for i in $(seq 1 15); do
                        redis-cli ping && break
                        echo "Waiting for Redis... attempt $i"
                        sleep 1
                      done
              - step:
                  type: Run
                  name: Install Composer
                  identifier: Install_Composer
                  spec:
                    shell: Bash
                    command: |-
                      php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
                      php composer-setup.php --install-dir=/usr/local/bin --filename=composer
                      php -r "unlink('composer-setup.php');"
                      composer --version
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Bash
                    command: |-
                      composer install --no-interaction --prefer-dist --optimize-autoloader
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    shell: Bash
                    command: |-
                      vendor/bin/phpcs --ignore=functions.php --standard=PSR2 src/ && vendor/bin/phpunit -c phpunit.xml.dist -v --testsuite integration --coverage-clover coverage.xml
              - step:
                  type: Run
                  name: SonarQube Scan
                  identifier: SonarQube_Scan
                  when:
                    stageStatus: Success
                    condition: <+matrix.phpVersion> == "8.3"
                  spec:
                    shell: Sh
                    command: |-
                      export SONAR_SCANNER_VERSION=5.0.1.3006
                      curl -sSLo sonar-scanner.zip \
                        "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_SCANNER_VERSION}-linux.zip"
                      unzip -q sonar-scanner.zip
                      export PATH="$PWD/sonar-scanner-${SONAR_SCANNER_VERSION}-linux/bin:$PATH"
                      apt-get install -y openjdk-17-jdk -qq
                      sonar-scanner \
                        -Dsonar.projectKey=php-client \
                        -Dsonar.sources=src \
                        -Dsonar.tests=tests \
                        -Dsonar.host.url=https://sonar.harness.io \
                        -Dsonar.token=<+secrets.getValue("sonarqube-token")> \
                        -Dsonar.php.coverage.reportPaths=coverage.xml \
                        -Dsonar.coverage.exclusions="tests/**,**/vendor/**" \
                        -Dsonar.exclusions="**/vendor/**,**/.git/**"
              - step:
                  type: Run
                  name: Post Quality Gate
                  identifier: Post_Quality_Gate
                  when:
                    stageStatus: Success
                    condition: <+matrix.phpVersion> == "8.3"
                  spec:
                    shell: Bash
                    command: |-
                      #!/bin/bash
                      set -e

                      SONAR_TOKEN="<+secrets.getValue("sonarqube-token")>"
                      SONAR_URL="https://sonar.harness.io"
                      SONAR_PROJECT_KEY="php-client"
                      GITHUB_TOKEN="<+secrets.getValue("github-devops-token")>"
                      GITHUB_REPO="php-client"
                      COMMIT_SHA="<+codebase.commitSha>"

                      STATUS_JSON=$(curl -sf \
                        -H "Authorization: Bearer ${SONAR_TOKEN}" \
                        "${SONAR_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}")

                      QG_STATUS=$(echo "$STATUS_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)['projectStatus']['status'])")

                      case "$QG_STATUS" in
                        OK)    GH_STATE="success"; DESCRIPTION="Quality gate passed" ;;
                        ERROR) GH_STATE="failure"; DESCRIPTION="Quality gate failed" ;;
                        WARN)  GH_STATE="success"; DESCRIPTION="Quality gate passed with warnings" ;;
                        *)     GH_STATE="pending"; DESCRIPTION="Quality gate status unknown" ;;
                      esac

                      TARGET_URL="${SONAR_URL}/dashboard?id=${SONAR_PROJECT_KEY}"

                      curl -sf -X POST \
                        -H "Authorization: token ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github.v3+json" \
                        -H "Content-Type: application/json" \
                        -d "{\"state\":\"${GH_STATE}\",\"description\":\"${DESCRIPTION}\",\"context\":\"sonarqube/quality-gate\",\"target_url\":\"${TARGET_URL}\"}" \
                        "https://api.github.com/repos/splitio/${GITHUB_REPO}/statuses/${COMMIT_SHA}"

                      echo "Posted SonarQube quality gate status: ${GH_STATE}"
        strategy:
          matrix:
            phpVersion:
              - "7.3"
              - "8.0"
              - "8.1"
              - "8.2"
              - "8.3"
